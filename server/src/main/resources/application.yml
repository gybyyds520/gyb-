server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: xqfx-server
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/xqfx?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: '123456'
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 5s
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# ---- 自定义配置 ----
xqfx:
  # JWT
  jwt:
    secret: xqfx-ollama-graduation-project-secret-key-2026-please-change-in-production
    expiration: 7200000        # 2 小时
    refresh-expiration: 604800000  # 7 天
  # Ollama 本地大模型
  ollama:
    base-url: http://127.0.0.1:11434
    primary-model: llama3.2:3b
    fallback-model: qwen2.5-coder:1.5b-base
    # 命题对生成质量要求更高，练习题单独用规模更大的本地模型；不可用自动回落主模型
    practice-model: llama3.1:8b
    embed-model: nomic-embed-text:latest
    timeout: 120s
    stream: true
    enabled: true
    # 模型不可用时自动降级为规则化文本，保证功能可用
    fallback-to-rule: true
    # 本地不可用时允许转云端（双轨：本地优先、云端兜底）；未配置 api-key 时云端通道自动关闭
    fallback-to-cloud: false
  # 大模型路由：auto=本地优先云端兜底 | local=仅本地 | cloud=仅云端
  llm:
    provider: auto
    cloud:
      # 免费服务商推荐：智谱开放平台 GLM-4.7-Flash（输入/输出/缓存长期免费，200K 上下文，OpenAI 兼容）
      # 注册领取 api-key：https://open.bigmodel.cn/ → 控制台创建 API Key；填入后把上方 fallback-to-cloud 改为 true 即启用云端兜底
      # 备选（按量付费）：DeepSeek https://api.deepseek.com/v1 model=deepseek-chat；通义 https://dashscope.aliyuncs.com/compatible-mode/v1 model=qwen-turbo
      base-url: https://open.bigmodel.cn/api/paas/v4
      api-key: ""
      model: glm-4.7-flash
      timeout: 60s
  # Python 预测推理微服务
  ml:
    base-url: http://127.0.0.1:8000
    # 外部开源训练样本（天池/UCI/xAPI，由 ml/data/import_external.py 生成）；文件不存在时自动忽略
    external-dataset: ../ml/data/external/external_features.csv
  # 教务系统对接适配器（mock=内置演示数据源；接入真实教务系统时切换为对应实现）
  acad:
    provider: mock
    mock-batch: 50
  # 启动实时初始化：空库时自动生成演示数据，保证启动即处于实时可演示状态
  bootstrap:
    auto-demo: true
    demo-count: 200
  # 运行中实时数据流：定时模拟新考勤/在线行为/新预警
  realtime:
    enabled: true
    interval-ms: 60000
    batch: 5
  # 数据脱敏开关
  privacy:
    mask-phone: true
    mask-id-card: true
    # 出校提示词脱敏（发送到云端前对手机号/身份证打码）
    mask-llm-prompt: true
  # 文件上传
  file:
    upload-path: ./upload/

logging:
  level:
    root: info
    com.gyb.xqfx: debug

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
